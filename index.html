<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A quiet, read-only view into an llm_wiki Obsidian vault." />
    <meta name="theme-color" content="#536b4e" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23536b4e'/%3E%3Cpath d='m14 18 8 30h7l3-14 3 14h7l8-30h-7l-5 21-3-14h-6l-3 14-5-21z' fill='%23fffefa'/%3E%3C/svg%3E" />
    <title>LLM Wiki</title>
    <script>
      // apply saved theme before first paint to avoid flash
      document.documentElement.dataset.theme =
        localStorage.getItem('wiki-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
